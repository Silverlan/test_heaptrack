name: Build and Release Heaptrack

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag for the release (e.g., v1.5.0)'
        required: true
        default: 'v1.5.0'
      branch:
        description: 'Branch or tag of kde/heaptrack to build'
        required: true
        default: 'stable'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build on Ubuntu
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kde/heaptrack
        uses: actions/checkout@v4
        with:
          repository: kde/heaptrack
          ref: ${{ github.event.inputs.branch }}

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          # Core build tools, compression, and missing Boost container
          sudo apt-get install -y build-essential cmake extra-cmake-modules \
            zlib1g-dev libzstd-dev libunwind-dev \
            libboost-system-dev libboost-filesystem-dev libboost-iostreams-dev \
            libboost-program-options-dev libboost-container-dev \
            libelf-dev libdw-dev gettext

          # Install Qt5 and KF5 dependencies (Available on Ubuntu 24.04)
          sudo apt-get install -y \
            qtbase5-dev \
            libkf5coreaddons-dev \
            libkf5i18n-dev \
            libkf5itemmodels-dev \
            libkf5itemviews-dev \
            libkf5threadweaver-dev \
            libkf5configwidgets-dev \
            libkf5kio-dev \
            libkf5iconthemes-dev \
            libkf5widgetsaddons-dev \
            libkf5windowsystem-dev

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          # We explicitly force Qt5 to avoid the "Looking for Qt6" failure
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=/usr \
                -DQT_MAJOR_VERSION=5 ..

      - name: Build Heaptrack
        run: |
          cd build
          make -j$(nproc)

      - name: Verify GUI Build
        run: |
          if [ -f "build/bin/heaptrack_gui" ]; then
            echo "Success: heaptrack_gui was built."
          else
            echo "Error: heaptrack_gui was NOT built. Check the CMake output above."
            exit 1
          fi

      - name: Package the Build
        run: |
          cd build
          make install DESTDIR=../heaptrack-staging
          cd ../heaptrack-staging
          tar -czvf ../heaptrack-ubuntu-latest.tar.gz .

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: "Heaptrack Build ${{ github.event.inputs.tag_name }}"
          files: heaptrack-ubuntu-latest.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}