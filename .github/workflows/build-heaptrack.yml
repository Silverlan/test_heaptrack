name: Build and Release Heaptrack

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag for the release (e.g., v1.5.0-build)'
        required: true
        default: 'v1.5.0-build'
      heaptrack_ref:
        description: 'Branch or tag to build (v1.5.0 is recommended for GUI)'
        required: true
        default: 'v1.5.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build on Ubuntu 24.04
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kde/heaptrack
        uses: actions/checkout@v4
        with:
          repository: kde/heaptrack
          ref: ${{ github.event.inputs.heaptrack_ref }}

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          # Core build tools and performance libs
          sudo apt-get install -y build-essential cmake extra-cmake-modules \
            zlib1g-dev libzstd-dev libunwind-dev \
            libboost-system-dev libboost-filesystem-dev libboost-iostreams-dev \
            libboost-program-options-dev libboost-container-dev \
            libelf-dev libdw-dev gettext

          # Qt5 and KDE Frameworks 5 (Specifically for Ubuntu 24.04)
          sudo apt-get install -y \
            qtbase5-dev \
            libqt5svg5-dev \
            libkf5coreaddons-dev \
            libkf5i18n-dev \
            libkf5itemmodels-dev \
            libkf5itemviews-dev \
            libkf5threadweaver-dev \
            libkf5configwidgets-dev \
            libkf5kio-dev \
            libkf5iconthemes-dev \
            libkf5widgetsaddons-dev \
            libkf5windowsystem-dev

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          # We don't need QT_MAJOR_VERSION=5 for v1.5.0, it finds it automatically.
          # We use -DHEAPTRACK_BUILD_GUI=ON to ensure it fails here if deps are missing.
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=/usr \
                -DHEAPTRACK_BUILD_GUI=ON ..

      - name: Build Heaptrack
        run: |
          cd build
          make -j$(nproc)

      - name: Verify GUI Build
        run: |
          if [ ! -f "build/bin/heaptrack_gui" ]; then
            echo "::error::GUI binary not found! Check the logs above."
            exit 1
          fi

      - name: Package and Release
        run: |
          cd build
          make install DESTDIR=../heaptrack-staging
          cd ../heaptrack-staging
          tar -czvf ../heaptrack-ubuntu-latest.tar.gz .

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: "Heaptrack ${{ github.event.inputs.heaptrack_ref }}"
          files: heaptrack-ubuntu-latest.tar.gz
          body: "Release build of Heaptrack ${{ github.event.inputs.heaptrack_ref }} for Ubuntu."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}