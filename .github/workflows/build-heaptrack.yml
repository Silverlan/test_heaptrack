name: Build and Release Heaptrack

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag for the release (e.g., v1.6.0)'
        required: true
        default: 'nightly'
      branch:
        description: 'Branch or tag of kde/heaptrack to build'
        required: true
        default: 'master'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build on Ubuntu
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kde/heaptrack
        uses: actions/checkout@v4
        with:
          repository: kde/heaptrack
          ref: ${{ github.event.inputs.branch }}

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          # Core build tools and compression
          sudo apt-get install -y build-essential cmake extra-cmake-modules \
            zlib1g-dev libzstd-dev libunwind-dev \
            libboost-system-dev libboost-filesystem-dev libboost-iostreams-dev \
            libboost-program-options-dev libboost-container-dev \
            libelf-dev libdw-dev gettext

          # Install Qt6 and KF6 dependencies for the GUI
          sudo apt-get install -y \
            qt6-base-dev \
            qt6-base-private-dev \
            libqt6widgets6 \
            libkf6coreaddons-dev \
            libkf6i18n-dev \
            libkf6itemmodels-dev \
            libkf6threadweaver-dev \
            libkf6configwidgets-dev \
            libkf6kio-dev \
            libkf6iconthemes-dev \
            libkf6widgetsaddons-dev \
            libkf6notifications-dev

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          # Explicitly tell CMake to look for Qt6
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=/usr \
                -DQT_MAJOR_VERSION=6 ..

      - name: Build Heaptrack
        run: |
          cd build
          make -j$(nproc)

      - name: Package the Build
        run: |
          cd build
          make install DESTDIR=../heaptrack-staging
          cd ../heaptrack-staging
          tar -czvf ../heaptrack-ubuntu-latest.tar.gz .

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: "Heaptrack Build ${{ github.event.inputs.tag_name }}"
          files: heaptrack-ubuntu-latest.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}