name: Build and Release Heaptrack

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag for the release (e.g., v1.5.0-build)'
        required: true
        default: 'v1.5.0-build'
      heaptrack_ref:
        description: 'Branch or tag to build (e.g., master, v1.5.0)'
        required: true
        default: 'master'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build on Ubuntu
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kde/heaptrack
        uses: actions/checkout@v4
        with:
          repository: kde/heaptrack
          # Use the input ref; default is 'master'
          ref: ${{ github.event.inputs.heaptrack_ref }}

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake extra-cmake-modules \
            zlib1g-dev libzstd-dev libunwind-dev \
            libboost-system-dev libboost-filesystem-dev libboost-iostreams-dev \
            libboost-program-options-dev libboost-container-dev \
            libelf-dev libdw-dev gettext \
            qtbase5-dev \
            libkf5coreaddons-dev \
            libkf5i18n-dev \
            libkf5itemmodels-dev \
            libkf5itemviews-dev \
            libkf5threadweaver-dev \
            libkf5configwidgets-dev \
            libkf5kio-dev \
            libkf5iconthemes-dev \
            libkf5widgetsaddons-dev \
            libkf5windowsystem-dev

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          # Force Qt5 and standard install paths
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=/usr \
                -DQT_MAJOR_VERSION=5 ..

      - name: Build Heaptrack
        run: |
          cd build
          make -j$(nproc)

      - name: Verify GUI Build
        run: |
          # Ensure the GUI binary actually exists before proceeding
          if [ ! -f "build/bin/heaptrack_gui" ]; then
            echo "::error::heaptrack_gui binary was not generated. Check CMake logs."
            exit 1
          fi

      - name: Package the Build
        run: |
          cd build
          make install DESTDIR=../heaptrack-staging
          cd ../heaptrack-staging
          tar -czvf ../heaptrack-ubuntu-latest.tar.gz .

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: "Heaptrack Build (${{ github.event.inputs.heaptrack_ref }})"
          files: heaptrack-ubuntu-latest.tar.gz
          body: "Automated build of heaptrack branch/tag: ${{ github.event.inputs.heaptrack_ref }}"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}